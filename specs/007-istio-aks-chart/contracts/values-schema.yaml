# Contract: Helm Values Schema

**Feature**: 007-istio-aks-chart  
**Contract Type**: Values File Structure Definition  
**Date**: 2026-05-20

## Purpose

This contract defines the canonical structure for `values.yaml` files across all three Istio charts (base, istiod, gateway), ensuring consistency and providing JSON Schema validation.

---

## Base Chart Values Schema

**File**: `charts/istio/base/values.schema.json`

```json
{
  "$schema": "https://json-schema.org/draft-07/schema#",
  "title": "Istio Base Chart Values",
  "type": "object",
  "required": ["istioVersion", "createNamespace"],
  "properties": {
    "istioVersion": {
      "type": "string",
      "pattern": "^\\d+\\.\\d+\\.\\d+$",
      "description": "Istio version to install (semver format)",
      "examples": ["1.23.0"]
    },
    "createNamespace": {
      "type": "boolean",
      "description": "Whether to create istio-system namespace",
      "default": true
    },
    "validationWebhook": {
      "type": "boolean",
      "description": "Enable CRD schema validation",
      "default": true
    }
  }
}
```

**values.yaml:**
```yaml
# Istio version
istioVersion: "1.23.0"

# Namespace creation
createNamespace: true

# CRD validation
validationWebhook: true
```

