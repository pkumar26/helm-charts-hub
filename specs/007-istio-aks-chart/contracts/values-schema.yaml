## istiod Chart Values Schema

**File**: `charts/istio/istiod/values.schema.json`

```json
{
  "$schema": "https://json-schema.org/draft-07/schema#",
  "title": "Istio istiod Chart Values",
  "type": "object",
  "required": ["global", "replicaCount", "image", "resources"],
  "properties": {
    "global": {
      "type": "object",
      "required": ["istioVersion", "fips"],
      "properties": {
        "istioVersion": {
          "type": "string",
          "pattern": "^\\d+\\.\\d+\\.\\d+$"
        },
        "fips": {
          "type": "object",
          "required": ["enabled"],
          "properties": {
            "enabled": {
              "type": "boolean",
              "description": "Enable FIPS 140-2 mode"
            }
          }
        },
        "hub": {
          "type": "string",
          "description": "Container registry URL",
          "default": "docker.io/istio"
        },
        "tag": {
          "type": "string",
          "description": "Image tag (use -distroless for FIPS)"
        }
      }
    },
    "replicaCount": {
      "type": "integer",
      "minimum": 1,
      "maximum": 10,
      "description": "Number of istiod replicas (odd number recommended)"
    },
    "image": {
      "type": "object",
      "required": ["repository", "tag", "pullPolicy"],
      "properties": {
        "repository": {
          "type": "string",
          "default": "istio/pilot"
        },
        "tag": {
          "type": "string",
          "pattern": "^\\d+\\.\\d+\\.\\d+(-distroless)?$"
        },
        "pullPolicy": {
          "type": "string",
          "enum": ["Always", "IfNotPresent", "Never"],
          "default": "IfNotPresent"
        }
      }
    },
    "resources": {
      "type": "object",
      "required": ["requests", "limits"],
      "properties": {
        "requests": {
          "type": "object",
          "required": ["cpu", "memory"],
          "properties": {
            "cpu": {
              "type": "string",
              "pattern": "^\\d+m?$",
              "examples": ["500m", "1"]
            },
            "memory": {
              "type": "string",
              "pattern": "^\\d+(Mi|Gi)$",
              "examples": ["2Gi", "512Mi"]
            }
          }
        },
        "limits": {
          "type": "object",
          "required": ["cpu", "memory"],
          "properties": {
            "cpu": {
              "type": "string",
              "pattern": "^\\d+m?$"
            },
            "memory": {
              "type": "string",
              "pattern": "^\\d+(Mi|Gi)$"
            }
          }
        }
      }
    },
    "podSecurityContext": {
      "type": "object",
      "required": ["runAsNonRoot", "runAsUser"],
      "properties": {
        "runAsNonRoot": {
          "type": "boolean",
          "const": true,
          "description": "Must be true for production"
        },
        "runAsUser": {
          "type": "integer",
          "const": 1337,
          "description": "Istio default user ID"
        },
        "fsGroup": {
          "type": "integer",
          "default": 1337
        },
        "seccompProfile": {
          "type": "object",
          "properties": {
            "type": {
              "type": "string",
              "enum": ["RuntimeDefault", "Unconfined", "Localhost"]
            }
          }
        }
      }
    },
    "securityContext": {
      "type": "object",
      "required": ["allowPrivilegeEscalation", "readOnlyRootFilesystem", "capabilities"],
      "properties": {
        "allowPrivilegeEscalation": {
          "type": "boolean",
          "const": false,
          "description": "Must be false for production"
        },
        "readOnlyRootFilesystem": {
          "type": "boolean",
          "description": "Should be true for production"
        },
        "capabilities": {
          "type": "object",
          "required": ["drop"],
          "properties": {
            "drop": {
              "type": "array",
              "items": {
                "type": "string",
                "enum": ["ALL", "NET_ADMIN", "SYS_ADMIN"]
              },
              "minItems": 1,
              "description": "Must include ALL for production"
            }
          }
        }
      }
    },
    "security": {
      "type": "object",
      "required": ["mtls", "authorization", "networkPolicy"],
      "properties": {
        "mtls": {
          "type": "object",
          "required": ["enabled", "mode"],
          "properties": {
            "enabled": {
              "type": "boolean"
            },
            "mode": {
              "type": "string",
              "enum": ["STRICT", "PERMISSIVE", "DISABLE"],
              "description": "STRICT for production, PERMISSIVE for dev"
            }
          }
        },
        "authorization": {
          "type": "object",
          "required": ["enabled"],
          "properties": {
            "enabled": {
              "type": "boolean",
              "description": "Enable default-deny authorization policies"
            }
          }
        },
        "networkPolicy": {
          "type": "object",
          "required": ["enabled"],
          "properties": {
            "enabled": {
              "type": "boolean",
              "description": "Enable Kubernetes NetworkPolicy"
            }
          }
        }
      }
    },
    "autoscaling": {
      "type": "object",
      "required": ["enabled"],
      "properties": {
        "enabled": {
          "type": "boolean"
        },
        "minReplicas": {
          "type": "integer",
          "minimum": 1
        },
        "maxReplicas": {
          "type": "integer",
          "minimum": 2,
          "maximum": 20
        },
        "targetCPUUtilizationPercentage": {
          "type": "integer",
          "minimum": 50,
          "maximum": 90,
          "default": 80
        }
      },
      "if": {
        "properties": {"enabled": {"const": true}}
      },
      "then": {
        "required": ["minReplicas", "maxReplicas", "targetCPUUtilizationPercentage"]
      }
    },
    "nodeSelector": {
      "type": "object",
      "additionalProperties": {
        "type": "string"
      },
      "description": "Node selector labels (e.g., fips: 'true' for FIPS nodes)"
    },
    "tolerations": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "key": {"type": "string"},
          "operator": {"type": "string", "enum": ["Exists", "Equal"]},
          "value": {"type": "string"},
          "effect": {"type": "string", "enum": ["NoSchedule", "PreferNoSchedule", "NoExecute"]}
        }
      }
    },
    "affinity": {
      "type": "object",
      "properties": {
        "podAntiAffinity": {
          "type": "object",
          "description": "Anti-affinity rules to spread pods across zones"
        }
      }
    }
  }
}
```

**values.yaml (default):**
```yaml
global:
  istioVersion: "1.23.0"
  fips:
    enabled: false
  hub: docker.io/istio
  tag: 1.23.0

replicaCount: 1

image:
  repository: pilot
  tag: 1.23.0
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1337
  fsGroup: 1337
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

security:
  mtls:
    enabled: true
    mode: PERMISSIVE
  authorization:
    enabled: false
  networkPolicy:
    enabled: false

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
```

**values-prod.yaml:**
```yaml
global:
  fips:
    enabled: true
  tag: 1.23.0-distroless

replicaCount: 3

image:
  tag: 1.23.0-distroless
  pullPolicy: Always

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

security:
  mtls:
    mode: STRICT
  authorization:
    enabled: true
  networkPolicy:
    enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector:
  fips: "true"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app: istiod
      topologyKey: topology.kubernetes.io/zone
```

