## Validation

### Helm Lint with Schema

```bash
# Install Helm schema plugin
helm plugin install https://github.com/losisin/helm-values-schema-json

# Validate values files
helm lint charts/istio/istiod --values charts/istio/istiod/values-prod.yaml
```

### JSON Schema Validation

```bash
# Install AJV (JSON Schema validator)
npm install -g ajv-cli

# Validate values file against schema
ajv validate \
  -s charts/istio/istiod/values.schema.json \
  -d charts/istio/istiod/values-prod.yaml
```

---

## Summary

This values schema contract ensures:
- ✅ Consistent structure across all three charts
- ✅ Type validation (integers, strings, booleans)
- ✅ Required fields enforcement
- ✅ Enum validation (e.g., mTLS mode)
- ✅ Pattern matching (e.g., semver versions)
- ✅ Conditional requirements (e.g., HPA settings when enabled)

All values files MUST pass schema validation before deployment to production.
