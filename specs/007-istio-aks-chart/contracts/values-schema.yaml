## Gateway Chart Values Schema

**File**: `charts/istio/gateway/values.schema.json`

```json
{
  "$schema": "https://json-schema.org/draft-07/schema#",
  "title": "Istio Gateway Chart Values",
  "type": "object",
  "required": ["global", "replicaCount", "image", "service", "resources"],
  "properties": {
    "global": {
      "type": "object",
      "required": ["istioVersion", "fips"],
      "properties": {
        "istioVersion": {"type": "string"},
        "fips": {
          "type": "object",
          "properties": {
            "enabled": {"type": "boolean"}
          }
        },
        "hub": {"type": "string"},
        "tag": {"type": "string"}
      }
    },
    "replicaCount": {
      "type": "integer",
      "minimum": 1
    },
    "image": {
      "type": "object",
      "required": ["repository", "tag", "pullPolicy"],
      "properties": {
        "repository": {
          "type": "string",
          "default": "proxyv2"
        },
        "tag": {"type": "string"},
        "pullPolicy": {"type": "string"}
      }
    },
    "service": {
      "type": "object",
      "required": ["type", "ports"],
      "properties": {
        "type": {
          "type": "string",
          "enum": ["LoadBalancer", "NodePort", "ClusterIP"],
          "description": "Service type (LoadBalancer recommended for AKS)"
        },
        "ports": {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["name", "port", "targetPort", "protocol"],
            "properties": {
              "name": {"type": "string"},
              "port": {"type": "integer"},
              "targetPort": {"type": "integer"},
              "protocol": {"type": "string", "enum": ["TCP", "UDP"]}
            }
          },
          "minItems": 1
        },
        "annotations": {
          "type": "object",
          "additionalProperties": {"type": "string"},
          "description": "Azure LB annotations for health probes"
        },
        "externalTrafficPolicy": {
          "type": "string",
          "enum": ["Cluster", "Local"],
          "description": "Local preserves client IP"
        }
      }
    },
    "resources": {
      "type": "object",
      "required": ["requests", "limits"],
      "properties": {
        "requests": {
          "type": "object",
          "required": ["cpu", "memory"],
          "properties": {
            "cpu": {"type": "string"},
            "memory": {"type": "string"}
          }
        },
        "limits": {
          "type": "object",
          "required": ["cpu", "memory"],
          "properties": {
            "cpu": {"type": "string"},
            "memory": {"type": "string"}
          }
        }
      }
    },
    "podSecurityContext": {
      "type": "object",
      "required": ["runAsNonRoot", "runAsUser"],
      "properties": {
        "runAsNonRoot": {"type": "boolean"},
        "runAsUser": {"type": "integer"},
        "fsGroup": {"type": "integer"}
      }
    },
    "securityContext": {
      "type": "object",
      "required": ["allowPrivilegeEscalation", "capabilities"],
      "properties": {
        "allowPrivilegeEscalation": {"type": "boolean"},
        "readOnlyRootFilesystem": {"type": "boolean"},
        "capabilities": {
          "type": "object",
          "properties": {
            "drop": {"type": "array", "items": {"type": "string"}}
          }
        }
      }
    },
    "security": {
      "type": "object",
      "required": ["mtls", "authorization"],
      "properties": {
        "mtls": {
          "type": "object",
          "properties": {
            "enabled": {"type": "boolean"},
            "mode": {"type": "string", "enum": ["STRICT", "PERMISSIVE"]}
          }
        },
        "authorization": {
          "type": "object",
          "properties": {
            "enabled": {"type": "boolean"},
            "allowedSources": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "ipBlocks": {
                    "type": "array",
                    "items": {"type": "string", "format": "ipv4"}
                  }
                }
              }
            }
          }
        },
        "networkPolicy": {
          "type": "object",
          "properties": {
            "enabled": {"type": "boolean"}
          }
        }
      }
    },
    "autoscaling": {
      "type": "object",
      "properties": {
        "enabled": {"type": "boolean"},
        "minReplicas": {"type": "integer"},
        "maxReplicas": {"type": "integer"},
        "targetCPUUtilizationPercentage": {"type": "integer"}
      }
    }
  }
}
```

**values.yaml:**
```yaml
global:
  istioVersion: "1.23.0"
  fips:
    enabled: false
  hub: docker.io/istio
  tag: 1.23.0

replicaCount: 1

image:
  repository: proxyv2
  tag: 1.23.0
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  ports:
  - name: http2
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  annotations: {}
  externalTrafficPolicy: Local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 2000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1337
  fsGroup: 1337

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

security:
  mtls:
    enabled: true
    mode: PERMISSIVE
  authorization:
    enabled: false
  networkPolicy:
    enabled: false

autoscaling:
  enabled: false
```

**values-prod.yaml:**
```yaml
global:
  fips:
    enabled: true
  tag: 1.23.0-distroless

replicaCount: 3

image:
  tag: 1.23.0-distroless
  pullPolicy: Always

service:
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz/ready"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-interval: "5"
  externalTrafficPolicy: Local

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

security:
  mtls:
    mode: STRICT
  authorization:
    enabled: true
    allowedSources:
    - ipBlocks:
      - "10.0.0.0/8"
      - "192.168.0.0/16"
  networkPolicy:
    enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector:
  fips: "true"
```

