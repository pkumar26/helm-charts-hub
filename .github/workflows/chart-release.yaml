name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: |
          # Build dependencies for all charts including nested Istio charts
          for chart in charts/*/ charts/istio/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Building dependencies for $chart"
              helm dependency build "$chart" || echo "No dependencies or failed for $chart"
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          # Note: chart-releaser will discover both top-level and nested Istio charts
          # Istio charts: base, istiod, gateway, kiali (under charts/istio/)
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
