name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Build chart dependencies
        run: |
          # Build dependencies for all charts including nested Istio charts
          for chart in charts/*/ charts/istio/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Building dependencies for $chart"
              helm dependency build "$chart" || echo "No dependencies or failed for $chart"
            fi
          done

      - name: List changed charts
        id: list
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint charts
        if: steps.list.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list.outputs.changed == 'true'
        uses: helm/kind-action@v1

      - name: Install test
        if: steps.list.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # Note: Istio charts require sequential installation (base → istiod → gateway → kiali)
          # chart-testing may fail for Istio charts due to this dependency
          # Use examples/deploy-istio-*.sh scripts for proper installation testing
          ct install --target-branch ${{ github.event.repository.default_branch }}
