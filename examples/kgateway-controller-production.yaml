# Production example — kgateway-controller
# Use: helm install kgateway charts/kgateway-controller -f examples/kgateway-controller-production.yaml
replicaCount: 3

controller:
  logLevel: warn
  enableEnvoy: true
  validationMode: strict
  goMemLimit: "512MiB"
  proxy:
    image:
      registry: cr.kgateway.dev/kgateway-dev
      repository: kgateway
      pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}

gatewayApi:
  createGatewayClass: true
  gatewayClassName: kgateway

metrics:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

verticalPodAutoscaler:
  enabled: true
  updateMode: "Off"
  minAllowed:
    cpu: 200m
    memory: 512Mi
  maxAllowed:
    cpu: "4"
    memory: 4Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kgateway-controller
          topologyKey: kubernetes.io/hostname
