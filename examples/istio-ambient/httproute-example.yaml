# HTTPRoute Example - Application Team
# This file shows how application teams create routes to the shared Gateway

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sampleapp-route
  namespace: default  # Application team's namespace
spec:
  # Reference the shared Gateway in istio-system namespace
  parentRefs:
  - name: istio-gateway
    namespace: istio-system
  
  # Optional: Hostname-based routing
  # hostnames:
  # - "myapp.example.com"
  
  rules:
  # Example 1: Simple path-based routing
  - matches:
    - path:
        type: Exact
        value: /
    backendRefs:
    - name: sampleapp
      port: 80
  
  # Example 2: Path prefix routing
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /api
  #   backendRefs:
  #   - name: api-service
  #     port: 8080
  
  # Example 3: Multiple path matches
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /app
  #   - path:
  #       type: PathPrefix
  #       value: /admin
  #   backendRefs:
  #   - name: app-service
  #     port: 8080
  
  # Example 4: Header-based routing
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /
  #     headers:
  #     - name: x-version
  #       value: v2
  #   backendRefs:
  #   - name: app-v2
  #     port: 8080
  
  # Example 5: Traffic split (canary/blue-green)
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /
  #   backendRefs:
  #   - name: app-v1
  #     port: 8080
  #     weight: 90  # 90% of traffic
  #   - name: app-v2
  #     port: 8080
  #     weight: 10  # 10% of traffic
