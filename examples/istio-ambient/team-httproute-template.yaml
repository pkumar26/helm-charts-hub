# Example: Another team in "team-b" namespace using the shared gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
---
# Their application service (example)
apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: team-b
spec:
  selector:
    app: my-app
  ports:
  - port: 8080
    targetPort: 8080
---
# ReferenceGrant to allow istio-system Gateway to access team-b Services
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-istio-gateway-to-team-b
  namespace: team-b
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: istio-system
  to:
  - group: ""
    kind: Service
---
# HTTPRoute to configure routing from shared gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app-route
  namespace: team-b
spec:
  parentRefs:
  - name: istio-gateway
    namespace: istio-system
  # Optional: Use hostname-based routing to avoid path conflicts with other teams
  hostnames:
  - "my-app.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: my-app
      port: 8080
