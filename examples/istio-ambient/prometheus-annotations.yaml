# Add Prometheus scrape annotations to Istio services
# This ensures Azure Monitor discovers and scrapes Istio metrics
#
# Apply once per cluster with:
#   kubectl apply -f istio-prometheus-annotations.yaml
#
# Alternative command (no file needed):
#   kubectl annotate svc istiod -n istio-system prometheus.io/scrape=true prometheus.io/port=15014 prometheus.io/path=/metrics --overwrite
---
apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: istio-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "15014"
    prometheus.io/path: "/metrics"
  labels:
    app: istiod
    istio: pilot
spec:
  type: ClusterIP
  ports:
  - name: grpc-xds
    port: 15010
    protocol: TCP
    targetPort: 15010
  - name: https-dns
    port: 15012
    protocol: TCP
    targetPort: 15012
  - name: https-webhook
    port: 443
    protocol: TCP
    targetPort: 15017
  - name: http-monitoring
    port: 15014
    protocol: TCP
    targetPort: 15014
  selector:
    app: istiod
    istio: pilot
