# Kiali configured to use Azure Managed Prometheus
# This allows Kiali to visualize your mesh using Azure Monitor as the data source
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali
  namespace: istio-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: istio-system
data:
  config.yaml: |
    auth:
      strategy: anonymous  # For demo/dev. Use 'openid' or 'token' for production
    deployment:
      accessible_namespaces:
      - '**'
      namespace: istio-system
    external_services:
      prometheus:
        # Bundled Prometheus for Kiali queries
        url: "http://prometheus.istio-system:9090"
      grafana:
        enabled: false
      tracing:
        enabled: false
    istio_namespace: istio-system
    istio_labels:
      app_label_name: "app"
      version_label_name: "version"
    server:
      web_root: /kiali
      port: 20001
    # Enable mTLS status display
    kiali_feature_flags:
      istio_injection_action: true
      istio_upgrade_action: false
    # Health configuration for mTLS checks
    health_config:
      rate:
        - namespace: ".*"
          kind: ".*"
          tolerance:
            - code: "^5\\d\\d$"
              failure: 10
              protocol: "http"
            - code: "^4\\d\\d$"
              degraded: 10
              protocol: "http"
---
apiVersion: v1
kind: Service
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
  annotations:
    # Uncomment for Internal LoadBalancer (Private IP only):
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    
    # Optional: Specify subnet for internal LB
    # service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "kiali-subnet"
spec:
  type: LoadBalancer  # Change to ClusterIP if using HTTPRoute/Ingress
  
  # CRITICAL for Azure AKS: Set to Local to fix Azure LB health probe issues
  # Without this, LoadBalancer may get IP but traffic will timeout
  # Apply via patch if not working: kubectl patch svc kiali -n istio-system -p '{"spec":{"externalTrafficPolicy":"Local"}}'
  externalTrafficPolicy: Local
  
  ports:
  - name: http
    protocol: TCP
    port: 20001
  selector:
    app: kiali
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiali
  template:
    metadata:
      labels:
        app: kiali
    spec:
      serviceAccountName: kiali
      containers:
      - name: kiali
        image: quay.io/kiali/kiali:v1.86
        imagePullPolicy: IfNotPresent
        command:
        - "/opt/kiali/kiali"
        - "-config"
        - "/kiali-configuration/config.yaml"
        ports:
        - name: api-port
          containerPort: 20001
        readinessProbe:
          httpGet:
            path: /kiali/healthz
            port: 20001
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /kiali/healthz
            port: 20001
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 30
        env:
        - name: ACTIVE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: kiali-configuration
          mountPath: "/kiali-configuration"
        - name: kiali-secret
          mountPath: "/kiali-secret"
        - name: kiali-cabundle
          mountPath: "/kiali-cabundle"
      volumes:
      - name: kiali-configuration
        configMap:
          name: kiali
      - name: kiali-secret
        secret:
          secretName: kiali
          optional: true
      - name: kiali-cabundle
        configMap:
          name: kiali-cabundle
          optional: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali
rules:
- apiGroups: [""]
  resources:
  - configmaps
  - endpoints
  - pods
  - pods/log
  - pods/portforward
  - replicationcontrollers
  - services
  - nodes
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups: [""]
  resources:
  - pods/portforward
  verbs:
  - create
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups: ["batch"]
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups: ["networking.istio.io", "security.istio.io", "gateway.networking.k8s.io"]
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
- apiGroups: ["telemetry.istio.io", "extensions.istio.io"]
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali
subjects:
- kind: ServiceAccount
  name: kiali
  namespace: istio-system
