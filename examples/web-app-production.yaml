# Production web-app example
# Deploy with: helm install my-app charts/web-app -f examples/web-app-production.yaml
image:
  repository: nginx
  tag: "1.27-alpine"

replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-tls
      hosts:
        - app.example.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

annotations:
  platform.example.com/team: platform
  platform.example.com/environment: production
