# Example: Istio Gateway (Ingress) - Production Configuration with Security Baseline
#
# This example demonstrates production-grade gateway deployment with:
# - FIPS 140-2 compliance (distroless images)
# - STRICT mTLS enforcement
# - Full security baseline (PeerAuthentication, AuthorizationPolicy, NetworkPolicy)
# - High availability (3 replicas with pod anti-affinity)
# - Horizontal Pod Autoscaling (3-5 replicas)
# - Production resource limits
#
# Prerequisites:
#   - Istio base chart installed (CRDs)
#   - Istiod (control plane) running and healthy
#   - AKS cluster with FIPS-enabled node pool
#   - Node pool labeled: fips=enabled
#
# Installation:
#   helm install istio-ingressgateway charts/istio/gateway \
#     --namespace istio-system \
#     -f examples/istio-gateway-production.yaml \
#     --wait --timeout 10m
#
# Verification:
#   # Check gateway pods
#   kubectl get pods -n istio-system -l app=istio-ingressgateway
#   
#   # Verify FIPS image
#   kubectl get pods -n istio-system -l app=istio-ingressgateway \
#     -o jsonpath='{.items[0].spec.containers[0].image}'
#   # Expected: docker.io/istio/proxyv2:1.23.0-distroless
#   
#   # Check service and LoadBalancer IP
#   kubectl get svc istio-ingressgateway -n istio-system
#   # Wait for EXTERNAL-IP to be assigned
#   
#   # Verify security policies
#   kubectl get peerauthentication,authorizationpolicy,networkpolicy -n istio-system
#   
#   # Check HPA
#   kubectl get hpa -n istio-system -l app=istio-ingressgateway
#
# Test Traffic:
#   # Get gateway IP
#   export GATEWAY_IP=$(kubectl get svc istio-ingressgateway -n istio-system \
#     -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
#   
#   # Test HTTP endpoint (requires Gateway and VirtualService configured)
#   curl -v http://$GATEWAY_IP/
#
# Next Steps:
#   1. Create Gateway resource for your domain
#   2. Create VirtualService to route traffic to your services
#   3. Configure TLS certificates (cert-manager recommended)
#   4. Optional: Install Kiali for mesh visualization
#

#
# FIPS 140-2 Compliance Configuration
#
global:
  # Enable FIPS mode for BoringSSL/BoringCrypto
  fips:
    enabled: true
  
  # STRICT mTLS enforcement
  mtls:
    mode: STRICT

#
# Gateway Service Configuration
#
service:
  type: LoadBalancer
  
  # Ports for HTTP, HTTPS, and status
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
  
  # Azure LoadBalancer annotations
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz/ready"
  
  # LoadBalancer source ranges (restrict to specific IPs in production)
  loadBalancerSourceRanges: []
    # - "10.0.0.0/8"      # Example: Internal network
    # - "203.0.113.0/24"  # Example: Office IP range

#
# High Availability Configuration
#
# 3 replicas for production HA
replicaCount: 3

# Horizontal Pod Autoscaling
customAutoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

# Pod anti-affinity for zone distribution
podAntiAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app: istio-ingressgateway
      topologyKey: topology.kubernetes.io/zone

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: istio-ingressgateway

#
# Resource Management
#
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

#
# Security Configuration
#
security:
  # PeerAuthentication: STRICT mTLS for gateway
  peerAuthentication:
    enabled: true
    mode: STRICT
  
  # AuthorizationPolicy: Default-deny with explicit allowlists
  authorizationPolicy:
    enabled: true
    policies:
      # Allow health checks from LoadBalancer
      - name: allow-health-checks
        action: ALLOW
        rules:
          - to:
              - operation:
                  paths: ["/healthz/ready", "/stats/prometheus"]
      
      # Allow inbound traffic from internet (gateway role)
      - name: allow-inbound-traffic
        action: ALLOW
        rules:
          - to:
              - operation:
                  ports: ["8080", "8443"]
      
      # Allow communication with istiod
      - name: allow-istiod-xds
        action: ALLOW
        rules:
          - to:
              - operation:
                  ports: ["15012"]
            from:
              - source:
                  principals: ["cluster.local/ns/istio-system/sa/istiod"]
  
  # NetworkPolicy: L3/L4 network isolation
  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    ingress:
      # Allow traffic from internet (via LoadBalancer)
      - from:
          - podSelector: {}
        ports:
          - protocol: TCP
            port: 8080   # HTTP
          - protocol: TCP
            port: 8443   # HTTPS
          - protocol: TCP
            port: 15021  # Status
    egress:
      # Allow communication with istiod
      - to:
          - podSelector:
              matchLabels:
                app: istiod
        ports:
          - protocol: TCP
            port: 15012  # XDS
      # Allow DNS
      - to:
          - namespaceSelector: {}
        ports:
          - protocol: UDP
            port: 53
      # Allow egress to application services (mesh workloads)
      - to:
          - namespaceSelector:
              matchLabels:
                istio-injection: enabled

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1337
  runAsGroup: 1337
  fsGroup: 1337
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE  # Required for ports 80/443

#
# Node Scheduling
#
# Schedule on FIPS-enabled nodes
nodeSelector:
  fips: enabled

# Tolerations for FIPS node taints
tolerations:
  - key: fips
    operator: Equal
    value: enabled
    effect: NoSchedule

#
# Gateway-Specific Configuration
#
# Envoy proxy configuration
env:
  # FIPS environment variables
  - name: GOFIPS
    value: "1"
  - name: FIPS_MODE
    value: "true"
  
  # Performance tuning
  - name: ISTIO_META_IDLE_TIMEOUT
    value: "1h"
  
  # Enable access logging
  - name: ISTIO_META_ACCESS_LOG_ENABLED
    value: "true"

# FIPS-compliant TLS configuration
istioGateway:
  tls:
    minProtocolVersion: TLSV1_2
    cipherSuites:
      # FIPS 140-2 approved cipher suites
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-CHACHA20-POLY1305
      - ECDHE-RSA-CHACHA20-POLY1305

#
# Observability Configuration
#
# Enable access logging to stdout
accessLogging:
  enabled: true
  format: |
    [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%"
    %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION%
    "%REQ(X-FORWARDED-FOR)%" "%REQ(USER-AGENT)%" "%REQ(X-REQUEST-ID)%"
    "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%"

# Prometheus metrics
telemetry:
  enabled: true
  v2:
    enabled: true

#
# Rolling Update Strategy
#
# Zero-downtime updates
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

#
# Pod Disruption Budget
#
podDisruptionBudget:
  enabled: true
  minAvailable: 2  # Ensure at least 2 replicas during disruptions

#
# Health Checks
#
livenessProbe:
  httpGet:
    path: /healthz/ready
    port: 15021
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 15021
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

#
# Labels and Annotations
#
labels:
  environment: production
  fips: enabled
  compliance: fips-140-2
  component: gateway
  istio: ingressgateway

annotations:
  managed-by: helm
  security-baseline: strict
  deployment-strategy: rolling-update

#
# Gateway Resources (Istio CRDs)
#
# Note: Gateway resources are typically created separately
# This section documents the pattern for reference
#
# Example Gateway resource:
# ---
# apiVersion: networking.istio.io/v1beta1
# kind: Gateway
# metadata:
#   name: my-gateway
#   namespace: istio-system
# spec:
#   selector:
#     istio: ingressgateway
#   servers:
#   - port:
#       number: 80
#       name: http
#       protocol: HTTP
#     hosts:
#     - "*.example.com"
#     # Optional: redirect HTTP to HTTPS
#     tls:
#       httpsRedirect: true
#   - port:
#       number: 443
#       name: https
#       protocol: HTTPS
#     hosts:
#     - "*.example.com"
#     tls:
#       mode: SIMPLE
#       credentialName: example-com-tls
#
# Example VirtualService:
# ---
# apiVersion: networking.istio.io/v1beta1
# kind: VirtualService
# metadata:
#   name: my-app
#   namespace: my-app-namespace
# spec:
#   hosts:
#   - "app.example.com"
#   gateways:
#   - istio-system/my-gateway
#   http:
#   - match:
#     - uri:
#         prefix: /
#     route:
#     - destination:
#         host: my-app-service
#         port:
#           number: 80

#
# Production Best Practices
#
# 1. TLS Certificate Management:
#    - Use cert-manager for automatic certificate provisioning
#    - Store certificates in Kubernetes secrets
#    - Configure certificate rotation
#
# 2. Traffic Management:
#    - Create Gateway resources for your domains
#    - Configure VirtualServices for routing rules
#    - Use DestinationRules for traffic policies
#
# 3. Security:
#    - Enable Web Application Firewall (Azure Application Gateway)
#    - Configure DDoS protection
#    - Implement rate limiting policies
#    - Use AuthorizationPolicy for fine-grained access control
#
# 4. Monitoring:
#    - Configure Prometheus scraping for metrics
#    - Set up Grafana dashboards
#    - Configure alerts for gateway health
#    - Monitor LoadBalancer bandwidth usage
#
# 5. Scaling:
#    - Tune HPA thresholds based on traffic patterns
#    - Monitor connection pool utilization
#    - Adjust resource requests/limits as needed
#
# 6. Disaster Recovery:
#    - Backup Gateway and VirtualService configurations
#    - Document LoadBalancer IP (for DNS)
#    - Test failover procedures
#    - Maintain runbooks for common issues
