{{/*
GatewayClass — registers Envoy Gateway as a Gateway API implementation.
Only rendered when gatewayClass.create is true.
*/}}
{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "common-lib.labels" (dict "root" . "extraLabels" .Values.labels) | nindent 4 }}
  annotations:
    {{- include "common-lib.annotations" (dict "root" . "extraAnnotations" .Values.annotations) | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
{{- end }}
