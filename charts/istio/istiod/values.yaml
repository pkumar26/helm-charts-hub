# Default values for istiod control plane chart
# This is a YAML-formatted file
# Declare variables to be passed into your templates

# Istio revision for canary upgrades (leave empty for default)
revision: ""

# Global Istio configuration (passed to subchart)
global:
  # Image registry and tag
  hub: docker.io/istio
  tag: "1.23.0"
  
  # Istio namespace
  istioNamespace: istio-system
  
  # FIPS 140-2 compliance configuration
  fips:
    # Enable FIPS mode (uses distroless images with BoringSSL)
    enabled: false
  
  # Proxy configuration
  proxy:
    # Resource limits for sidecar proxies
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 2000m
        memory: 1024Mi

# Pilot (istiod) configuration
# NOTE: These values are passed to the upstream `istiod` subchart and MUST be
# nested under the `istiod:` key. Only `global:` is auto-propagated by Helm;
# any pilot settings placed at the top level are silently ignored by the subchart.
istiod:
  pilot:
    # Number of istiod replicas (used when autoscaleEnabled is false)
    replicaCount: 1

    # Disable the upstream chart's HPA; this wrapper ships its own
    # HorizontalPodAutoscaler template driven by `customAutoscaling` below.
    autoscaleEnabled: false

    # Resource requests and limits
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Pod anti-affinity for high availability
    affinity: {}
    # Example for production:
    # podAntiAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #   - labelSelector:
    #       matchExpressions:
    #       - key: app
    #         operator: In
    #         values:
    #         - istiod
    #     topologyKey: topology.kubernetes.io/zone

    # Node selector
    nodeSelector: {}

    # Tolerations
    tolerations: []

    # Environment variables
    env: {}

# Horizontal Pod Autoscaler configuration (rendered by this wrapper chart's
# templates/hpa.yaml, not the upstream subchart).
customAutoscaling:
  # Enable HPA
  enabled: false
  # Minimum number of replicas
  minReplicas: 1
  # Maximum number of replicas
  maxReplicas: 5
  # Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # Target memory utilization percentage
  # targetMemoryUtilizationPercentage: 80
  
  # HPA scaling behavior (optional)
  behavior: {}
  # Example:
  # scaleDown:
  #   stabilizationWindowSeconds: 300
  #   policies:
  #   - type: Percent
  #     value: 50
  #     periodSeconds: 60
  # scaleUp:
  #   stabilizationWindowSeconds: 0
  #   policies:
  #   - type: Percent
  #     value: 100
  #     periodSeconds: 15

# Security baseline configuration
security:
  # Peer authentication (mTLS)
  peerAuthentication:
    enabled: true
    # Mode: STRICT, PERMISSIVE, or DISABLE
    mode: PERMISSIVE
  
  # Authorization policies
  authorizationPolicy:
    # Default deny-all policy
    denyAll:
      enabled: false
    # Allow webhook traffic
    allowWebhook:
      enabled: false
    # Allow XDS communication
    allowXDS:
      enabled: false
  
  # Network policy for L3/L4 isolation
  networkPolicy:
    enabled: false

# Additional labels for all resources
labels: {}
  # Example:
  # environment: production
  # team: platform

# Additional annotations for all resources
annotations: {}
  # Example:
  # managed-by: argocd
