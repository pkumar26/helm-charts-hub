# Production environment values for istiod
# Full FIPS 140-2 compliance and security baseline for classified environments

revision: ""

global:
  hub: docker.io/istio
  tag: "1.23.0-distroless"  # FIPS-compliant distroless image (BoringSSL/BoringCrypto)
  istioNamespace: istio-system
  
  # FIPS 140-2 compliance ENABLED for production
  fips:
    enabled: true  # Uses distroless images with BoringSSL/BoringCrypto
  
  proxy:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 2000m
        memory: 1024Mi

istiod:
  pilot:
    # 3 replicas for production high availability (per NFR-003)
    replicaCount: 3

    # Wrapper chart manages autoscaling via customAutoscaling (avoids a
    # duplicate HPA from the upstream subchart targeting the same Deployment)
    autoscaleEnabled: false

    # Resource limits per FR-007: 500m CPU, 2Gi memory
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Pod anti-affinity for zone spreading (NFR-003 high availability)
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - istiod
          topologyKey: topology.kubernetes.io/zone

    # FIPS environment variables (GOFIPS=1 enables BoringCrypto in the
    # distroless image; FIPS_MODE is consumed by Istio for FIPS enforcement)
    env:
      GOFIPS: "1"
      FIPS_MODE: "true"

# HPA enabled for production autoscaling per FR-008
customAutoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80  # FR-008: default 80% CPU
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

# Production security baseline configuration (FR-004, FR-005)
security:
  # FR-004: STRICT mTLS enforcement
  peerAuthentication:
    enabled: true
    mode: STRICT  # No plaintext traffic allowed
  
  # FR-005: Authorization policies with default-deny
  authorizationPolicy:
    denyAll:
      enabled: true  # Default deny all traffic
    allowWebhook:
      enabled: true  # Allow Kubernetes webhook traffic
    allowXDS:
      enabled: true  # Allow Envoy xDS communication
  
  # FR-010: Network policy for L3/L4 isolation
  networkPolicy:
    enabled: true

labels:
  environment: production
  managed-by: helm
  team: platform
  compliance: fips-140-2
  security-zone: classified
  criticality: high

annotations:
  description: "Production istiod with FIPS 140-2 compliance"
  owner: "platform-team"
  cost-center: "infrastructure"
  security-baseline: "strict"
  backup-policy: "daily"
  monitoring: "enabled"
