# Development environment values for istio-gateway
# PERMISSIVE mTLS, minimal resources, NodePort service

global:
  fips:
    enabled: false  # No FIPS in dev

istioGateway:
  enabled: true
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"

security:
  peerAuthentication:
    enabled: false  # Disabled in dev for easier testing
  authorizationPolicy:
    enabled: false  # Disabled in dev
  networkPolicy:
    enabled: false  # Disabled in dev

customAutoscaling:
  enabled: false

# Values for upstream gateway subchart
gateway:
  name: istio-ingressgateway
  replicaCount: 1
  
  service:
    type: NodePort
    ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30080
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: false
  
  labels:
    environment: dev
    team: platform
    managed-by: helm
