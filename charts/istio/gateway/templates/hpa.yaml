{{- if .Values.customAutoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "istio-gateway.fullname" . }}
  namespace: {{ include "istio-gateway.namespace" . }}
  labels:
    {{- include "istio-gateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.customAutoscaling.targetDeploymentName | default "istio-ingressgateway" }}
  minReplicas: {{ .Values.customAutoscaling.minReplicas }}
  maxReplicas: {{ .Values.customAutoscaling.maxReplicas }}
  metrics:
  {{- if .Values.customAutoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.customAutoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.customAutoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.customAutoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- with .Values.customAutoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
