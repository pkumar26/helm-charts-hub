{{/*
Traefik Service — LoadBalancer with web (HTTP) and websecure (HTTPS) ports.
Uses common-lib for labels, annotations, and naming.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common-lib.fullname" . }}
  labels:
    {{- include "common-lib.labels" (dict "root" . "extraLabels" .Values.labels) | nindent 4 }}
  annotations:
    {{- $svcAnnotations := default (dict) .Values.service.annotations }}
    {{- if .Values.service.internal }}
    {{- $_ := set $svcAnnotations "service.beta.kubernetes.io/aws-load-balancer-internal" "true" }}
    {{- $_ := set $svcAnnotations "networking.gke.io/load-balancer-type" "Internal" }}
    {{- $_ := set $svcAnnotations "service.beta.kubernetes.io/azure-load-balancer-internal" "true" }}
    {{- end }}
    {{- include "common-lib.annotations" (dict "root" . "extraAnnotations" (merge $svcAnnotations (default (dict) .Values.annotations))) | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.service.ports.web }}
      targetPort: web
      protocol: TCP
      name: web
    - port: {{ .Values.service.ports.websecure }}
      targetPort: websecure
      protocol: TCP
      name: websecure
    {{- if .Values.dashboard.enabled }}
    - port: 9000
      targetPort: traefik
      protocol: TCP
      name: traefik
    {{- end }}
  selector:
    {{- include "common-lib.selectorLabels" . | nindent 4 }}
