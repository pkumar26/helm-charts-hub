# Dev environment overlay for gateway-api (Istio ambient mode)
# Use with: helm install gateway-api charts/istio/gateway-api -f environments/dev/istio-gateway-api.values.yaml
# Relaxed security for faster iteration: PERMISSIVE mTLS, no FIPS, no network isolation.

global:
  hub: docker.io/istio
  tag: "1.30.0"
  istioNamespace: istio-system
  fips:
    enabled: false

security:
  peerAuthentication:
    enabled: true
    mode: PERMISSIVE  # Allow plaintext for debugging
    namespaceWide: true
  authorizationPolicy:
    enabled: false  # No access restrictions in dev
  networkPolicy:
    enabled: false  # No network isolation in dev

labels:
  environment: dev
  cluster: dev-aks-01
  managed-by: helm

annotations:
  deployment-target: "dev-aks-01.eastus.azure.com"
