# Dev environment values for web-app
# Usage: helm install my-app charts/web-app -f environments/dev/web-app.values.yaml --set image.repository=<img> --set image.tag=<tag>

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: false

autoscaling:
  enabled: false
