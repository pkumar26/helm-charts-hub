# Dev environment overlay for istiod
revision: ""
global:
  hub: docker.io/istio
  tag: "1.23.0"
  istioNamespace: istio-system
  fips:
    enabled: false

istiod:
  pilot:
    replicaCount: 1
    autoscaleEnabled: false  # Managed via customAutoscaling
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

customAutoscaling:
  enabled: false

security:
  peerAuthentication:
    enabled: true
    mode: PERMISSIVE
  networkPolicy:
    enabled: false

labels:
  environment: dev
  cluster: dev-aks-01
