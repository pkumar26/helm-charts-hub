# Development environment overlay for kiali
# Apply with: helm upgrade --install kiali charts/istio/kiali \
#   --namespace istio-system \
#   --values charts/istio/kiali/values-dev.yaml \
#   --values environments/dev/kiali.values.yaml

enabled: true  # Enable in dev for troubleshooting

kiali-server:
  deployment:
    replicas: 1
    service_type: LoadBalancer  # Expose Kiali via cloud load balancer

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  
  auth:
    strategy: anonymous  # No auth required in dev
  
  external_services:
    prometheus:
      # Istio Prometheus addon (samples/addons/prometheus.yaml) in istio-system
      url: "http://prometheus.istio-system:9090"

    grafana:
      enabled: false  # No in-cluster Grafana in dev; enable + set URL if you add one

labels:
  environment: dev
  managed-by: helm
