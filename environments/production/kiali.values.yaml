# Production environment overlay for kiali
# Apply with: helm upgrade --install kiali charts/istio/kiali \
#   --namespace istio-system \
#   --values charts/istio/kiali/values-prod.yaml \
#   --values environments/production/kiali.values.yaml

# IMPORTANT: Kiali is OPTIONAL in production
# Set enabled: true only if you need mesh visualization
# For air-gapped or minimal environments, leave disabled
enabled: false  # Set to true to enable

kiali-server:
  deployment:
    replicas: 1
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    
    # Production security hardening
    pod_security_context:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    
    security_context:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  
  auth:
    strategy: token  # Require Kubernetes token authentication
    # For OpenID authentication:
    # strategy: openid
    # openid:
    #   client_id: "kiali"
    #   issuer_uri: "https://login.microsoftonline.com/<tenant-id>/v2.0"
    #   username_claim: "preferred_username"
  
  service:
    type: ClusterIP  # Internal access only
    # For external access via LoadBalancer:
    # type: LoadBalancer
  
  external_services:
    prometheus:
      # UPDATE THIS URL to match your production Prometheus endpoint
      url: "http://prometheus-server.monitoring.svc.cluster.local:80"
      # Common alternatives:
      # url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
      # url: "http://ama-metrics-prometheus-server.kube-system.svc.cluster.local:80"  # Azure Monitor
    
    grafana:
      enabled: true
      # UPDATE THIS URL to match your production Grafana endpoint
      in_cluster_url: "http://grafana.monitoring.svc.cluster.local:80"
      # Common alternatives:
      # in_cluster_url: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
    
    tracing:
      enabled: false
      # If using Jaeger/Zipkin in production:
      # enabled: true
      # url: "http://jaeger-query.tracing.svc.cluster.local:16686"
  
  kiali_feature_flags:
    ui_defaults:
      refresh_interval: "30s"  # Longer refresh to reduce load
  
  # Optional: Enable ingress for external access
  ingress:
    enabled: false
    # class_name: nginx
    # hosts:
    # - kiali.example.com
    # tls:
    # - secretName: kiali-tls
    #   hosts:
    #   - kiali.example.com

labels:
  environment: production
  managed-by: helm
  criticality: low  # Kiali is optional, not critical for mesh operation

annotations:
  description: "Optional mesh visualization - disable for air-gapped environments"
