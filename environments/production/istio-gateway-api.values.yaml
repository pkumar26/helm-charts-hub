# Production environment overlay for gateway-api (Istio ambient mode)
# Use with: helm install gateway-api charts/istio/gateway-api -f environments/production/istio-gateway-api.values.yaml
# Full security baseline: FIPS posture, STRICT mTLS, default-deny
# AuthorizationPolicy with explicit allowlist, NetworkPolicy.

global:
  hub: docker.io/istio
  tag: "1.30.0-distroless"  # FIPS-compliant distroless images (BoringSSL)
  istioNamespace: istio-system
  fips:
    enabled: true  # FIPS 140-2 compliance for production

# Gateway resource: production listeners (HTTPS terminate)
gateway:
  name: istio-gateway
  namespace: istio-system
  gatewayClassName: istio
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local  # CRITICAL for Azure AKS health probes
    internal: false
    azure:
      healthProbe:
        enabled: true
        port: "15021"
        path: "/healthz/ready"
        protocol: "http"
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: gateway-tls
        kind: Secret

# Security baseline configuration
security:
  # STRICT mTLS enforcement
  peerAuthentication:
    enabled: true
    mode: STRICT
    namespaceWide: true

  # Default-deny with explicit allowlist (ALLOW action + rules)
  authorizationPolicy:
    enabled: true
    action: ALLOW
    rules:
    - from:
      - source:
          namespaces:
          - istio-system
          - production
      to:
      - operation:
          methods:
          - GET
          - POST
          - PUT
          - DELETE

  # NetworkPolicy for L3/L4 isolation
  networkPolicy:
    enabled: true

# Multi-tenant RBAC for Gateway/HTTPRoute management
rbac:
  enabled: true

labels:
  environment: production
  cluster: prod-aks-01
  managed-by: helm
  team: platform
  compliance: fips-140-2
  security-zone: classified

annotations:
  deployment-target: "prod-aks-01.eastus.azure.com"
  monitoring: "enabled"
  alerting: "enabled"
