# Traefik Controller — production environment overlay
replicaCount: 3
service:
  type: LoadBalancer
resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
dashboard:
  enabled: false
metrics:
  prometheus:
    enabled: true
tls:
  enabled: true
