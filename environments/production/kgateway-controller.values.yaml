# Production environment overlay — kgateway-controller
replicaCount: 3

controller:
  logLevel: warn
  enableEnvoy: true
  validationMode: strict

gatewayApi:
  createGatewayClass: true

metrics:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

verticalPodAutoscaler:
  enabled: true
  updateMode: "Off"
  minAllowed:
    cpu: 200m
    memory: 512Mi
  maxAllowed:
    cpu: "4"
    memory: 4Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
